[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalab"
dynamic = ["version"]
description = "CrystaLab — Módulo 1 (Fundamentos Estruturais) do laboratório didático Alloy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Uso interno do projeto Alloy" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
validacao = ["gemmi>=0.6"]
e2e = ["playwright>=1.44"]

[project.scripts]
crystalab = "crystalab.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "crystalab.__version__" }

[tool.setuptools.packages.find]
include = ["crystalab*"]

[tool.setuptools.package-data]
crystalab = ["core/dados/*.json", "web/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["crystalab/web/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "UP006", "UP007", "UP035", "UP045", "B008", "S104", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.9"
packages = ["crystalab.core"]
ignore_missing_imports = true
